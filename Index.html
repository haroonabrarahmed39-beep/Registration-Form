<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <form action="">
    <div class="registration-container">
        <div class="form-container">
            <div class="icon">
            <i class="fas fa-user-plus"></i>
            </div>
            <div>
            <h1 class="account">Create Account</h1>
            <p class="join">join us today!its quick and easy</p>
            </div>
            <div class="input-container">
                <div class="input-box">
                 <i class="fas fa-user"></i>
                <input type="text" placeholder="Full Name" required>
                </div>
                 <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input type="email" placeholder="E-mail" required>
                </div>
                <div class="input-box ">
                    <i class="fas fa-phone"></i>
                     <input type="tel" placeholder="Enter your phone" required>
                    </div>
                 <div class="input-box">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Password" required>
                </div>
                 <div class="input-box">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Confirm Password" required>
                </div>
                <div class="input1-container">
                <div class="input1">
                    <i class="fas fa-calendar" ></i>
                    <input type="text" placeholder="Date of Birth" onfocus="this.type='date'" required>
                </div>
                <div class="input1">
                    <i class="fas fa-venus-mars"></i>
                    <select name="Gender" id="" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Custom">Custom</option>
                    </select>
                    
                </div>
                 </div>
                 </div>
                 <div class="button-container">
                    <input type="checkbox" required > I agree to the <a href="Terms and condition.html">terms & condition</a> and <a href="privacy and policy.html">Privacy Policy</a>
                   <Button  class="btn" type="submit" >Register</Button>
                   <p>Already have an account?<a href="login.html">login</a></p>
                 </div>
            </div>
            </div>
        </div>
    </div>
    </form>
</body>
</html>
